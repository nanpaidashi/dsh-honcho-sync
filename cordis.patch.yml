# dsh-honcho-sync bundle patch
#
# Honcho memory plugin for DeepSeek Harness.
# Auto-syncs conversation turns and provides memory tools (recall/search/remember).
# A visual settings panel is available in DSH settings (click "Honcho Memory").
#
# Environment variables:
#   HONCHO_URL     - Honcho API base URL (required, e.g. http://192.168.0.4:8000)
#   HONCHO_WORKSPACE - Workspace name (must be configured)
#
# Installation:
#   dsh plugin --profile web add link:https://github.com/nanpaidashi/dsh-honcho-sync dsh web
#
# Overlay order: dsh-base -> this bundle patch -> profile cordis.patch.yml -> --patch

- insert:
    - id: honcho-sync
      name: '@nanpaidashi/dsh-honcho-sync'
      config:
        honchoUrl: __FROM_ENV__
        workspace: ''
        userPeer: user
        agentPeer: agent
        debounceMs: 3000
        autoRecall: true
        recallBudget: 2000
        autoSync: true
        messageMaxChars: 25000
